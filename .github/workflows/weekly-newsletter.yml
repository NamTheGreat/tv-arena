name: TV Arena Weekly Newsletter Draft

on:
  schedule:
    # Monday 06:00 UTC: after the Sunday-night nightly sync has completed the previous movers week
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      week:
        description: 'Week start (Monday, YYYY-MM-DD). Empty = latest completed week'
        required: false
        default: ''
      force:
        description: 'Replace an existing draft (never a published one)'
        type: boolean
        default: false
      dry_run:
        description: 'Generate the Markdown artifact without saving to the database'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

jobs:
  draft-newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate newsletter draft
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$INPUT_WEEK" ]; then args+=(--week "$INPUT_WEEK"); fi
          if [ "$INPUT_FORCE" = "true" ]; then args+=(--force); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/generate-newsletter.mjs "${args[@]}"

      - name: Upload draft
        if: ${{ hashFiles('newsletter-drafts/*.md') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: newsletter-draft
          path: newsletter-drafts/*.md
          retention-days: 30

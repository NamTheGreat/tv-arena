name: Dependabot patch and minor auto-merge

on:
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read Dependabot update type
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for all checks to pass
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          REQUIRED_CHECKS=("Frontend (TypeScript & Vite)" "Rust Pipeline (Format, Clippy, Test)" "Database Migration Replay (Postgres 15)")
          echo "Waiting for CI checks to register and pass on $PR_URL..."
          for attempt in $(seq 1 45); do
            checks="$(gh pr checks "$PR_URL" --json name,bucket 2>/dev/null || true)"
            if [ -n "$checks" ] && [ "$checks" != "[]" ]; then
              filtered="$(jq '[.[] | select(.name != "auto-merge" and (.name | test("auto-merge"; "i") | not))]' <<< "$checks" 2>/dev/null || echo "[]")"
              total="$(jq 'length' <<< "$filtered" 2>/dev/null || echo "0")"

              if [ "$total" -gt 0 ]; then
                failed="$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<< "$filtered")"
                if [ "$failed" -gt 0 ]; then
                  echo "One or more checks failed:"
                  jq '.[] | select(.bucket == "fail" or .bucket == "cancel")' <<< "$filtered"
                  exit 1
                fi

                pending="$(jq '[.[] | select(.bucket == "pending")] | length' <<< "$filtered")"

                all_required_passed=true
                for req in "${REQUIRED_CHECKS[@]}"; do
                  status="$(jq -r --arg n "$req" '.[] | select(.name == $n) | .bucket' <<< "$filtered")"
                  if [ "$status" != "pass" ] && [ "$status" != "skipping" ]; then
                    all_required_passed=false
                    break
                  fi
                done

                if [ "$all_required_passed" = true ] && [ "$pending" -eq 0 ]; then
                  echo "All required checks and all $total registered checks passed successfully."
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for required checks to pass."
          exit 1

      - name: Enable auto-merge (merge commit)
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --auto --merge --delete-branch

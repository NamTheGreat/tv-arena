name: Dependabot patch and minor auto-merge

on:
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read Dependabot update type
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for all checks to pass
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for attempt in $(seq 1 60); do
            checks="$(gh pr checks "$PR_URL" --json bucket 2>/dev/null || true)"
            if [ -n "$checks" ] && [ "$(jq 'length' <<< "$checks")" -gt 0 ]; then
              gh pr checks "$PR_URL" --watch --fail-fast --interval 10
              exit $?
            fi
            sleep 10
          done
          echo "No CI checks appeared for the Dependabot pull request."
          exit 1

      - name: Enable squash auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash --delete-branch

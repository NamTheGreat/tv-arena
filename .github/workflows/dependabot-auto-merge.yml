name: Dependabot patch and minor auto-merge

on:
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Read Dependabot update type
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for all checks to pass
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for attempt in $(seq 1 120); do
            checks="$(gh pr checks "$PR_URL" --json name,bucket 2>/dev/null || true)"
            if [ -n "$checks" ] && [ "$(jq 'length' <<< "$checks")" -gt 0 ]; then
              filtered="$(jq '[.[] | select(.name != "auto-merge" and (.name | test("auto-merge"; "i") | not))]' <<< "$checks")"
              total="$(jq 'length' <<< "$filtered")"
              if [ "$total" -gt 0 ]; then
                pending="$(jq '[.[] | select(.bucket == "pending")] | length' <<< "$filtered")"
                failed="$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<< "$filtered")"
                if [ "$failed" -gt 0 ]; then
                  echo "One or more checks failed:"
                  jq '.[] | select(.bucket == "fail" or .bucket == "cancel")' <<< "$filtered"
                  exit 1
                fi
                if [ "$pending" -eq 0 ]; then
                  echo "All $total external checks passed successfully."
                  exit 0
                fi
              fi
            fi
            sleep 10
          done
          echo "Timed out waiting for checks to pass."
          exit 1

      - name: Enable squash auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --auto --squash --delete-branch 2>/dev/null || gh pr merge "$PR_URL" --squash --delete-branch

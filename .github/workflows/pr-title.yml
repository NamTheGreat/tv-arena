name: PR Title

on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Test conventional title validator
        run: node .github/scripts/test_pr_title.cjs
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/check_pr_title.cjs "$PR_TITLE"

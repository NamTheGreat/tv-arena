name: Lint SQL Migrations

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'supabase/migrations/*.sql'
      - '.squawk.toml'
      - '.github/workflows/lint-migrations.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  squawk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find new migrations
        id: new-migrations
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          files=$(git diff --diff-filter=A --name-only "origin/$BASE_REF...HEAD" -- 'supabase/migrations/*.sql' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
      - name: Verify view replacement rule catches column removal
        run: python3 .github/scripts/test_squawk_rule.py
      - name: Lint new migrations and comment findings
        uses: sbdchd/squawk-action@v2
        if: steps.new-migrations.outputs.files != ''
        with:
          files: ${{ steps.new-migrations.outputs.files }}
          config: '.squawk.toml'
          version: '2.70.0'
          fail-on-violations: 'false'

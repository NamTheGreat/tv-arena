name: Lint SQL Migrations

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'supabase/migrations/*.sql'
      - '.squawk.toml'
      - '.github/workflows/lint-migrations.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  squawk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Verify view replacement rule catches column removal
        run: python3 .github/scripts/test_squawk_rule.py
      - name: Lint migrations and comment findings
        uses: sbdchd/squawk-action@v2
        with:
          pattern: 'supabase/migrations/*.sql'
          config: '.squawk.toml'
          version: '2.70.0'
          fail-on-violations: 'false'

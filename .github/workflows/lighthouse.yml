name: Lighthouse Preview Budgets

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Cloudflare preview URL parsing
        run: python3 .github/scripts/test_cloudflare_preview_url.py
      - name: Wait for Cloudflare Pages preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/cloudflare_preview_url.py
      - name: Run Lighthouse CI
        env:
          LHCI_ENFORCE_BUDGETS: ${{ vars.LHCI_ENFORCE_BUDGETS || 'false' }}
        run: npx --yes @lhci/cli@0.15.1 autorun --config=./lighthouserc.cjs --collect.url="$PREVIEW_URL"
      - name: Comment Lighthouse scores on the pull request
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/comment_lighthouse.py

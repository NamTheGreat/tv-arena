name: CI Quality Gates

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (TypeScript & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and Build
        run: npm run build

  pipeline:
    name: Rust Pipeline (Format, Clippy, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipeline

      - name: Check Formatting
        run: cargo fmt --check --manifest-path pipeline/Cargo.toml

      - name: Clippy Linter
        run: cargo clippy --manifest-path pipeline/Cargo.toml -- -D warnings

      - name: Run Tests
        run: cargo test --manifest-path pipeline/Cargo.toml

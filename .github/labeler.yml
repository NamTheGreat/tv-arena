frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/**'
          - 'index.html'
          - 'package.json'
          - 'package-lock.json'
          - 'tailwind.config.js'
          - 'vite.config.ts'
          - 'tsconfig*.json'

rust-pipeline:
  - changed-files:
      - any-glob-to-any-file:
          - 'pipeline/**'

database:
  - changed-files:
      - any-glob-to-any-file:
          - 'supabase/**'

ci-cd:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'LICENSE'

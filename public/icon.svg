<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C66A3D"/>
      <stop offset="100%" stop-color="#8A3E1C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle inner border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Television Frame / Arena Screen -->
  <g filter="url(#shadow)">
    <!-- Screen Outer -->
    <rect x="96" y="128" width="320" height="236" rx="40" fill="#1E1A17" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>

    <!-- Screen Inner Glass -->
    <rect x="116" y="148" width="280" height="196" rx="24" fill="#2A2421"/>

    <!-- Head-to-Head Arena Graph / Signal Line -->
    <path d="M 136 280 L 190 250 L 240 270 L 300 190 L 376 210" fill="none" stroke="#E3824F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="300" cy="190" r="7" fill="#FFFFFF"/>
    <circle cx="376" cy="210" r="7" fill="#E3824F"/>

    <!-- Arena Stand Base -->
    <path d="M 216 364 L 296 364 L 320 404 L 192 404 Z" fill="#14110F" rx="4"/>
  </g>
</svg>
